[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamic-file-comparison-agent"
version = "0.1.0"
description = "Deterministic, streaming comparison of large files"
requires-python = ">=3.11"
dependencies = [
    "azure-identity>=1.17",
    "azure-storage-blob>=12.20",
    "boto3>=1.34",
    "duckdb>=1.2",
    "google-cloud-storage>=2.18",
    "lxml>=5.0",
    "paramiko>=3.4",
    "pydantic>=2.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
